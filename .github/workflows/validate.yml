name: Validate rules

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Rebuild outputs from committed sources
        run: python3 scripts/sync_rules.py --offline

      - name: Require reproducible generated files
        run: git diff --exit-code

      - name: Validate rules and source locks
        run: python3 scripts/validate_rules.py

      - name: Scan for private data and credentials
        run: python3 scripts/privacy_scan.py

